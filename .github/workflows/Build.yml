name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: '选择编译类型'
        required: true
        default: 'dev'
        options:
          - 'dev'
          - 'release'

permissions:
  contents: read

# Focus clients discover installable APKs from this repository's GitHub Releases.
env:
  GITHUB_APK_DISTRIBUTION_ENABLED: "true"

jobs:
  quality-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Miuix source
        uses: actions/checkout@v4
        with:
          repository: compose-miuix-ui/miuix
          ref: 5157b503e86e2bfc2db61db00fff5df41326394a
          path: .ci/miuix
          persist-credentials: false

      - name: Align pinned Miuix AGP with the app build
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = Path(".ci/miuix")
          expected_revision = "5157b503e86e2bfc2db61db00fff5df41326394a"
          actual_revision = subprocess.check_output(
              ["git", "-C", str(source), "rev-parse", "HEAD"], text=True
          ).strip()
          if actual_revision != expected_revision:
              raise SystemExit(f"Unexpected Miuix source revision: {actual_revision}")

          catalog = source / "gradle/libs.versions.toml"
          lines = catalog.read_text(encoding="utf-8").splitlines()
          target = 'agp = "9.4.0"'
          matches = [index for index, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one {target!r} entry in {catalog}")
          index = matches[0]
          indentation = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indentation + 'agp = "9.3.2"'
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Run source and policy guards
        run: |
          chmod +x gradlew
          ./gradlew "-Pbili.miuix.source=${GITHUB_WORKSPACE}/.ci/miuix" \
            :app:testDebugUnitTest \
            --tests 'com.android.purebilibili.feature.settings.AppUpdateCheckerTest' \
            --tests 'com.android.purebilibili.feature.settings.AppVersionPolicyTest' \
            --tests 'com.android.purebilibili.feature.settings.ApkArtifactNamingPolicyTest' \
            --tests 'com.android.purebilibili.core.store.PreferenceKeyUniquenessTest' \
            --tests 'com.android.purebilibili.core.ui.lint.HardcodedColorLintTest' \
            --tests 'com.android.purebilibili.core.ui.lint.HardcodedSpacingLintTest' \
            --tests 'com.android.purebilibili.core.ui.lint.HardcodedTypographyLintTest' \
            --tests 'com.android.purebilibili.core.ui.lint.MigratedFeatureStyleLintTest' \
            --tests 'com.android.purebilibili.core.ui.lint.StyleLintAllowlistRatchetTest' \
            --tests 'com.android.purebilibili.core.ui.perf.FrameBudgetLintTest' \
            --no-daemon \
            --console=plain

  build:
    runs-on: ubuntu-latest
    needs: quality-guards
    permissions:
      contents: read
    outputs:
      build_type: ${{ steps.set_build_type.outputs.build_type }}
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Miuix source
        uses: actions/checkout@v4
        with:
          repository: compose-miuix-ui/miuix
          ref: 5157b503e86e2bfc2db61db00fff5df41326394a
          path: .ci/miuix
          persist-credentials: false

      - name: Align pinned Miuix AGP with the app build
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = Path(".ci/miuix")
          expected_revision = "5157b503e86e2bfc2db61db00fff5df41326394a"
          actual_revision = subprocess.check_output(
              ["git", "-C", str(source), "rev-parse", "HEAD"], text=True
          ).strip()
          if actual_revision != expected_revision:
              raise SystemExit(f"Unexpected Miuix source revision: {actual_revision}")

          catalog = source / "gradle/libs.versions.toml"
          lines = catalog.read_text(encoding="utf-8").splitlines()
          target = 'agp = "9.4.0"'
          matches = [index for index, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one {target!r} entry in {catalog}")
          index = matches[0]
          indentation = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indentation + 'agp = "9.3.2"'
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Set Build Type
        id: set_build_type
        env:
          REQUESTED_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="$REQUESTED_BUILD_TYPE"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BUILD_TYPE="release"
          else
            BUILD_TYPE="dev"
          fi

          if [ "$BUILD_TYPE" = "release" ] && \
             { [[ "${GITHUB_REF}" != refs/tags/v* ]] || [ "$REF_PROTECTED" != "true" ]; }; then
            echo "Release builds require a protected refs/tags/v* ref." >&2
            exit 1
          fi

          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "构建类型已设置"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Configure optional Firebase services
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_protected && steps.set_build_type.outputs.build_type == 'release'
        env:
          FCM_CONFIG_BASE64: ${{ secrets.FCM }}
        run: |
          if [ -n "$FCM_CONFIG_BASE64" ]; then
            printf '%s' "$FCM_CONFIG_BASE64" | base64 --decode > app/google-services.json
          else
            echo "Firebase config is absent; continuing with Firebase disabled."
          fi

      - name: Prepare Focus release signing key
        if: steps.set_build_type.outputs.build_type == 'release' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected
        env:
          FOCUS_RELEASE_KEYSTORE_B64: ${{ secrets.FOCUS_RELEASE_KEYSTORE_B64 }}
          FOCUS_RELEASE_STORE_PASSWORD: ${{ secrets.FOCUS_RELEASE_STORE_PASSWORD }}
          FOCUS_RELEASE_KEY_ALIAS: ${{ secrets.FOCUS_RELEASE_KEY_ALIAS }}
          FOCUS_RELEASE_KEY_PASSWORD: ${{ secrets.FOCUS_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = (
              "FOCUS_RELEASE_KEYSTORE_B64",
              "FOCUS_RELEASE_STORE_PASSWORD",
              "FOCUS_RELEASE_KEY_ALIAS",
              "FOCUS_RELEASE_KEY_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required Focus release signing secrets: " + ", ".join(missing))

          keystore = Path(os.environ["RUNNER_TEMP"]) / "focus-release.jks"
          try:
              keystore.write_bytes(base64.b64decode(os.environ[required[0]], validate=True))
          except Exception as error:
              raise SystemExit("Focus release keystore secret is not valid base64") from error
          if not keystore.is_file() or keystore.stat().st_size == 0:
              raise SystemExit("Focus release keystore secret decoded to an empty file")

          def escape_property(value: str) -> str:
              return (value.replace("\\", "\\\\").replace("\n", "\\n")
                      .replace("\r", "\\r").replace(":", "\\:")
                      .replace("=", "\\=").replace("#", "\\#")
                      .replace("!", "\\!").replace(" ", "\\ "))

          properties = {
              "storeFile": str(keystore),
              "storePassword": os.environ["FOCUS_RELEASE_STORE_PASSWORD"],
              "keyAlias": os.environ["FOCUS_RELEASE_KEY_ALIAS"],
              "keyPassword": os.environ["FOCUS_RELEASE_KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(f"{key}={escape_property(value)}\n" for key, value in properties.items()),
              encoding="utf-8",
          )
          PY

      - name: Build APK
        env:
          BILI_BUILD_COMMIT_SHA: ${{ github.sha }}
          BILI_BUILD_GIT_REF: ${{ github.ref }}
          BILI_BUILD_WORKFLOW_RUN_ID: ${{ github.run_id }}
          BILI_BUILD_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BILI_BUILD_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          COMMON_ARGS=(
            "-Pbili.miuix.source=${GITHUB_WORKSPACE}/.ci/miuix"
            "-Pbili.build.commitSha=${BILI_BUILD_COMMIT_SHA}"
            "-Pbili.build.gitRef=${BILI_BUILD_GIT_REF}"
            "-Pbili.build.workflowRunId=${BILI_BUILD_WORKFLOW_RUN_ID}"
            "-Pbili.build.workflowRunUrl=${BILI_BUILD_WORKFLOW_RUN_URL}"
            "-Pbili.build.releaseTag=${BILI_BUILD_RELEASE_TAG}"
          )
          if [ "${{ steps.set_build_type.outputs.build_type }}" = "release" ]; then
            ./gradlew "${COMMON_ARGS[@]}" assembleRelease
          else
            ./gradlew "${COMMON_ARGS[@]}" assembleDev
          fi

      - name: Verify upgrade signing certificate continuity
        if: steps.set_build_type.outputs.build_type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          BASELINE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | python3 -c '
          import json, os, sys
          releases = json.load(sys.stdin)
          current = os.environ.get("CURRENT_RELEASE_TAG", "")
          for release in releases:
              if release.get("draft") or release.get("tag_name") == current:
                  continue
              if any(asset.get("name", "").lower().endswith(".apk") for asset in release.get("assets", [])):
                  print(release.get("tag_name", ""))
                  break
          ')
          if [ -z "$BASELINE_TAG" ]; then
            echo "No published Focus APK is available to verify upgrade signing continuity."
            exit 1
          fi

          BASELINE_DIR="$RUNNER_TEMP/focus-signing-baseline"
          mkdir -p "$BASELINE_DIR"
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$BASELINE_DIR"
          BASELINE_APK="$(find "$BASELINE_DIR" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          NEW_APK="$(find "${{ github.workspace }}/app/build/outputs/bilipai/release" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$BASELINE_APK" ] || [ -z "$NEW_APK" ] || [ -z "$APKSIGNER" ]; then
            echo "Could not locate both APKs and apksigner for certificate continuity verification."
            exit 1
          fi

          cert_digest() {
            "$APKSIGNER" verify --print-certs "$1" 2>&1 \
              | awk -F ': ' '/certificate SHA-256 digest/ { print tolower($NF); exit }'
          }
          OLD_CERT="$(cert_digest "$BASELINE_APK")"
          NEW_CERT="$(cert_digest "$NEW_APK")"
          if [[ ! "$OLD_CERT" =~ ^[[:xdigit:]]{64}$ ]] ||
             [[ ! "$NEW_CERT" =~ ^[[:xdigit:]]{64}$ ]] ||
             [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "Release signing certificate does not match the latest published Focus APK."
            exit 1
          fi
          echo "Release APK uses the existing Focus signing certificate."

      - name: Collect release evidence
        id: collect_release_assets
        run: |
          APK_DIR="${{ github.workspace }}/app/build/outputs/bilipai/${{ steps.set_build_type.outputs.build_type }}"
          APK_FILES=$(find "$APK_DIR" -maxdepth 1 -name "BiliPai-*.apk" -type f)
          if [ -z "$APK_FILES" ]; then
            echo "No APK files found"
            exit 1
          fi

          DIST_DIR="${{ github.workspace }}/build/release-evidence"
          mkdir -p "$DIST_DIR"

          while IFS= read -r apk; do
            cp "$apk" "$DIST_DIR/"
          done <<< "$APK_FILES"

          pushd "$DIST_DIR" >/dev/null
          sha256sum *.apk | tee checksums.txt
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' "${{ github.workspace }}/app/build.gradle.kts" | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "${{ github.workspace }}/app/build.gradle.kts" | head -n 1)
          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist_dir = Path(os.environ["DIST_DIR"])
          metadata_path = dist_dir / "build-metadata.json"
          apk_files = sorted(dist_dir.glob("*.apk"))
          payload = {
              "schemaVersion": 1,
              "appId": "com.android.purebilibili.focus",
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "gitCommitSha": os.environ["GITHUB_SHA"],
              "gitRef": os.environ["GITHUB_REF"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunUrl": os.environ["WORKFLOW_RUN_URL"],
              "releaseTag": os.environ["RELEASE_TAG"],
              "generatedAt": os.environ["GENERATED_AT"],
              "artifacts": []
          }
          for apk in apk_files:
              sha256 = hashlib.sha256(apk.read_bytes()).hexdigest()
              payload["artifacts"].append({
                  "name": apk.name,
                  "sha256": sha256,
                  "sizeBytes": apk.stat().st_size,
              })

          metadata_path.write_text(json.dumps(payload, ensure_ascii=True, indent=2) + "\n", encoding="utf-8")
          PY
          popd >/dev/null

          echo "artifact_paths<<EOF" >> $GITHUB_OUTPUT
          find "$DIST_DIR" -maxdepth 1 -type f | sort >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          DIST_DIR: ${{ github.workspace }}/build/release-evidence
          GENERATED_AT: ${{ github.run_started_at }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Upload Build Artifacts
        if: env.GITHUB_APK_DISTRIBUTION_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai
          path: ${{ github.workspace }}/build/release-evidence
          retention-days: 7
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.ref_protected && needs.build.outputs.build_type == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BiliPai
          path: ${{ github.workspace }}/build/release-evidence

      - name: Generate artifact attestation
        id: attest_release
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: ${{ github.workspace }}/build/release-evidence/checksums.txt
          show-summary: true

      - name: Collect attestation evidence
        env:
          DIST_DIR: ${{ github.workspace }}/build/release-evidence
          ATTESTATION_URL: ${{ steps.attest_release.outputs.attestation-url }}
          ATTESTATION_ID: ${{ steps.attest_release.outputs.attestation-id }}
          BUNDLE_PATH: ${{ steps.attest_release.outputs.bundle-path }}
          BUNDLE_FILE_NAME: build-provenance.intoto.jsonl
          PREDICATE_TYPE: https://slsa.dev/provenance/v1
        run: |
          if [ -n "$BUNDLE_PATH" ] && [ -f "$BUNDLE_PATH" ]; then
            cp "$BUNDLE_PATH" "$DIST_DIR/$BUNDLE_FILE_NAME"
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dist_dir = Path(os.environ["DIST_DIR"])
          metadata_path = dist_dir / "verification-metadata.json"
          payload = {
              "schemaVersion": 1,
              "attestationId": os.environ.get("ATTESTATION_ID", ""),
              "attestationUrl": os.environ.get("ATTESTATION_URL", ""),
              "bundleFileName": os.environ.get("BUNDLE_FILE_NAME", ""),
              "predicateType": os.environ.get("PREDICATE_TYPE", ""),
          }
          metadata_path.write_text(json.dumps(payload, ensure_ascii=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release Assets
        if: env.GITHUB_APK_DISTRIBUTION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DIST_DIR: ${{ github.workspace }}/build/release-evidence
        run: |
          gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TAG" \
              --generate-notes

          gh release upload "$RELEASE_TAG" "$DIST_DIR"/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
