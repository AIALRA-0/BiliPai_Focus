name: Compose Compiler Reports

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Miuix source
        uses: actions/checkout@v4
        with:
          repository: compose-miuix-ui/miuix
          ref: 5157b503e86e2bfc2db61db00fff5df41326394a
          path: .ci/miuix
          persist-credentials: false

      - name: Align pinned Miuix AGP with the app build
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = Path(".ci/miuix")
          expected_revision = "5157b503e86e2bfc2db61db00fff5df41326394a"
          actual_revision = subprocess.check_output(
              ["git", "-C", str(source), "rev-parse", "HEAD"], text=True
          ).strip()
          if actual_revision != expected_revision:
              raise SystemExit(f"Unexpected Miuix source revision: {actual_revision}")

          catalog = source / "gradle/libs.versions.toml"
          lines = catalog.read_text(encoding="utf-8").splitlines()
          target = 'agp = "9.4.0"'
          matches = [index for index, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one {target!r} entry in {catalog}")
          index = matches[0]
          indentation = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indentation + 'agp = "9.3.2"'
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Compile release and collect Compose compiler data
        run: ./gradlew "-Pbili.miuix.source=${GITHUB_WORKSPACE}/.ci/miuix" :app:compileReleaseKotlin -Pbili.composeReports=true --no-daemon --no-configuration-cache --console=plain

      - name: Verify report output
        run: |
          test -d app/build/compose_reports
          test -d app/build/compose_metrics
          find app/build/compose_reports app/build/compose_metrics -type f -print -quit | grep -q .

      - name: Upload Compose compiler reports
        uses: actions/upload-artifact@v4
        with:
          name: compose-compiler-reports
          path: |
            app/build/compose_reports
            app/build/compose_metrics
          retention-days: 14
          if-no-files-found: error
