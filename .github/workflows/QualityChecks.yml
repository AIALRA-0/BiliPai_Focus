name: QualityChecks

# PRs run this workflow directly; pushes/build dispatches call it from Build once.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # GitHub runner 有 4 核；本地仍走 gradle.properties 的既有调优。
  CI_GRADLE_MAX_WORKERS: "4"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perfguard:
    name: PerfGuard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # 与 Build 的 build job 对齐：复用依赖缓存 + Gradle 构建缓存 + configuration cache，
      # 让三个 Quality job 在跨 push 时不必从零编译 app 模块。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run performance contracts and degradation behavior
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci_quality.sh performance
      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perfguard-diagnostics
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest
            design-system/build/reports/tests/testDebugUnitTest
            ci-lint/build/reports/tests/test
          retention-days: 7

  correctness:
    name: Correctness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # 与 Build 的 build job 对齐：复用依赖缓存 + Gradle 构建缓存 + configuration cache，
      # 让三个 Quality job 在跨 push 时不必从零编译 app 模块。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run preferences cache and version behavior
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci_quality.sh correctness
      - name: Upload correctness diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: correctness-diagnostics
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

  style-policy:
    name: StylePolicy (report)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # 与 Build 的 build job 对齐：复用依赖缓存 + Gradle 构建缓存 + configuration cache，
      # 让三个 Quality job 在跨 push 时不必从零编译 app 模块。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run style checker regressions and report style warnings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci_quality.sh style
      - name: Upload style diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: style-policy-diagnostics
          path: |
            app/build/reports/lint-results-debug.*
            ci-lint/build/reports/tests/test
          retention-days: 7
      - name: Explain informational findings
        if: success()
        run: |
          echo '### StylePolicy' >> "$GITHUB_STEP_SUMMARY"
          echo 'Style findings are informational in this CI profile; see style-policy-diagnostics.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilation, checker-loading and regression-test failures still fail this job.' >> "$GITHUB_STEP_SUMMARY"
