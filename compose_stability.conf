// Compose 编译器稳定性补充声明
//
// 为什么需要这个文件：
// VideoItem 是首页 / 搜索 / 历史 / 收藏所有视频卡片的唯一入参，它本身全部是 val。
// 但它的 recommendationFeedback.reasons 类型是 List<RecommendationFeedbackReason>，
// 而 kotlin.collections.List 是接口——编译器无法证明具体实现不可变，于是把整条
// 引用链推断为 unstable，VideoCard 因此永远不满足 skippable 条件。
//
// 后果是结构性的：首页任何祖先重组（底栏拖拽、header 折叠、下拉刷新弹簧）
// 都会连带重组每一张可见卡片，含每张卡最多 7 个 badge 的 unifiedBlur。
// 这不是某一处写错，而是「一个类型不稳定 → 整个热路径失去跳过能力」。
//
// 为什么不改成 ImmutableList：
// 这些类都带 @Serializable，而 kotlinx-collections-immutable 0.4.0 不提供
// ImmutableList 的序列化器，需要自定义 serializer 或 @Contextual，
// 改动会扩散到整条反序列化路径。稳定性配置文件是零代码改动的等价方案。
//
// ⚠️ 这行声明成立的前提是 data/model/** 下所有类构造后不再被修改。
// 该前提由 ModelImmutabilityGuardTest 强制守卫（禁止属性级 var 与可变集合类型）。
// 删掉那条测试，这里就变成一句无人兑现的空话——而**错误的稳定性承诺比不承诺更危险**：
// 编译器会据此跳过本该发生的重组，表现为界面不刷新，且极难定位。
com.android.purebilibili.data.model.**
